    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050505;
        color: #f4f4f2;
        font-family: Inter, "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
      }
      main {
        position: relative;
        height: 100svh;
        background: #050505;
      }
      .stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050505;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        width: min(100vw, calc(100svh * 48 / 9));
        height: min(100svh, calc(100vw * 9 / 48));
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #050505;
      }
      .contact {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 4;
        font-size: 8px;
        font-weight: 500;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: rgba(244, 244, 242, 0.35);
        text-decoration: none;
      }
      .contact:hover {
        color: rgba(244, 244, 242, 0.8);
      }
      .mark {
        pointer-events: none;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 32px;
        z-index: 4;
        display: flex;
        justify-content: center;
        color: #f4f4f2;
      }
      .lockup {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 7px;
      }
      .lockup svg {
        display: block;
        width: min(42vw, 280px);
        height: auto;
      }
      .lockup span {
        font-size: 8px;
        font-weight: 500;
        letter-spacing: 0.62em;
        text-transform: uppercase;
        color: rgba(244, 244, 242, 0.55);
        padding-left: 2px;
      }
    </style>
