    <style>
      :root {
        --void: #050505;
        --ink: #f4f4f2;
        --duration-stagger: 40ms;
        --duration-quick: 150ms;
        --duration-fast: 250ms;
        --duration-slow: 400ms;
        --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
        --pulse-dur: 1000ms;
        --pulse-min: 0.5;
        --reveal-dur: 400ms;
        --reveal-blur: 2px;
        --stagger-dur: 500ms;
        --stagger-distance: 12px;
        --stagger-blur: 3px;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--void);
        color: var(--ink);
        font-family: Inter, "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      main { position: relative; height: 100svh; background: var(--void); }
      .holo-stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: stretch;
        justify-content: center;
      }
      .holo-row {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100svh;
        overflow-x: hidden;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
      }
      .holo-clip {
        position: relative;
        flex: 0 0 auto;
        width: 100%;
        aspect-ratio: 16 / 9;
        scroll-snap-align: center;
        background: var(--void);
      }
      .holo-clip video, .holo-poster {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: var(--void);
      }
      .t-skel-skeleton, .t-skel-content { position: absolute; inset: 0; }
      .t-skel-skeleton {
        z-index: 1;
        opacity: 1;
        transition: opacity var(--reveal-dur) var(--ease-smooth-out),
                    filter var(--reveal-dur) var(--ease-smooth-out);
        transition-delay: var(--clip-delay, 0ms);
      }
      .t-skel-content {
        z-index: 2;
        opacity: 0;
        filter: blur(var(--reveal-blur));
        transition: opacity var(--reveal-dur) var(--ease-smooth-out),
                    filter var(--reveal-dur) var(--ease-smooth-out);
        transition-delay: var(--clip-delay, 0ms);
      }
      .t-skel.is-revealed .t-skel-skeleton { opacity: 0; filter: blur(var(--reveal-blur)); pointer-events: none; }
      .t-skel.is-revealed .t-skel-content { opacity: 1; filter: blur(0); }
      .holo-pulse {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent, rgb(244 244 242 / 0.04), transparent);
        animation: t-skel-pulse var(--pulse-dur) ease-in-out infinite;
      }
      @keyframes t-skel-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: var(--pulse-min); }
      }
      .contact {
        position: absolute;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        z-index: 4;
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        min-width: 44px;
        padding: 10px 12px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgb(244 244 242 / 0.45);
        text-decoration: none;
        opacity: 0;
        pointer-events: none;
        transition: color var(--duration-quick) var(--ease-smooth-out),
                    opacity var(--duration-slow) var(--ease-smooth-out);
      }
      .contact.is-shown { opacity: 1; pointer-events: auto; }
      .contact:hover, .contact:focus-visible { color: rgb(244 244 242 / 0.9); }
      .mark {
        pointer-events: none;
        position: absolute;
        left: 0;
        right: 0;
        bottom: max(24px, env(safe-area-inset-bottom));
        z-index: 4;
        display: flex;
        justify-content: center;
      }
      .mark img {
        display: block;
        width: min(56vw, 200px);
        height: auto;
        opacity: 0;
        transform: translateY(var(--stagger-distance));
        filter: blur(var(--stagger-blur));
        transition: opacity var(--stagger-dur) var(--ease-smooth-out),
                    transform var(--stagger-dur) var(--ease-smooth-out),
                    filter var(--stagger-dur) var(--ease-smooth-out);
      }
      .mark.is-shown img {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: var(--void);
        transition: opacity var(--duration-slow) var(--ease-smooth-out),
                    filter var(--duration-slow) var(--ease-smooth-out);
      }
      .boot.is-done {
        opacity: 0;
        filter: blur(var(--reveal-blur));
        pointer-events: none;
      }
      .boot-mark { position: relative; width: min(72vw, 240px); }
      .boot-logo {
        display: block;
        width: 100%;
        height: auto;
        animation: boot-in var(--stagger-dur) var(--ease-smooth-out) both;
      }
      .boot-shimmer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(105deg, transparent 38%, rgb(244 244 242 / 0.22) 50%, transparent 62%);
        background-size: 240% 100%;
        animation: boot-sweep 1.8s var(--ease-smooth-out) infinite;
        mix-blend-mode: screen;
      }
      .boot-bar {
        display: block;
        width: 42%;
        height: 1px;
        margin: 22px auto 0;
        background: rgb(244 244 242 / 0.55);
        transform: scaleX(0.08);
        transform-origin: center;
        transition: transform var(--duration-fast) var(--ease-smooth-out);
      }
      @keyframes boot-in {
        from { opacity: 0; transform: translateY(12px); filter: blur(var(--stagger-blur)); }
        to { opacity: 1; transform: translateY(0); filter: blur(0); }
      }
      @keyframes boot-sweep {
        from { background-position: 100% 0; }
        to { background-position: -100% 0; }
      }
      @media (min-width: 768px) {
        .holo-stage { align-items: center; }
        .holo-row {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 1px;
          width: min(100vw, calc(100svh * 48 / 9));
          height: min(100svh, calc(100vw * 9 / 48));
          overflow: hidden;
          scroll-snap-type: none;
        }
        .holo-clip { aspect-ratio: auto; height: 100%; }
        .mark img { width: min(52vw, 340px); }
        .boot-mark { width: min(42vw, 320px); }
        .contact {
          top: 20px;
          right: 20px;
          font-size: 8px;
          letter-spacing: 0.28em;
          padding: 8px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .t-skel-skeleton, .t-skel-content, .mark img, .contact, .boot, .boot-bar { transition: none !important; }
        .holo-pulse, .boot-logo, .boot-shimmer { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="holo-stage">
        <div class="holo-row">
          <div class="holo-clip t-skel" style="--clip-delay:0ms">
            <div class="t-skel-skeleton is-pulsing" aria-hidden="true">
              <img class="holo-poster" src="/poster-paint.jpg" alt="" />
              <div class="holo-pulse"></div>
            </div>
            <div class="t-skel-content">
              <video src="/holo-paint.mp4" poster="/poster-paint.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
            </div>
          </div>
          <div class="holo-clip t-skel" style="--clip-delay:40ms">
            <div class="t-skel-skeleton is-pulsing" aria-hidden="true">
              <img class="holo-poster" src="/poster-frame.jpg" alt="" />
              <div class="holo-pulse"></div>
            </div>
            <div class="t-skel-content">
              <video src="/holo-frame.mp4" poster="/poster-frame.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
            </div>
          </div>
          <div class="holo-clip t-skel" style="--clip-delay:80ms">
            <div class="t-skel-skeleton is-pulsing" aria-hidden="true">
              <img class="holo-poster" src="/poster-floor.jpg" alt="" />
              <div class="holo-pulse"></div>
            </div>
            <div class="t-skel-content">
              <video src="/holo-floor.mp4" poster="/poster-floor.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
            </div>
          </div>
        </div>
      </div>
      <a class="contact" id="contact" href="mailto:hello@river.industries">hello@river.industries</a>
      <div class="mark" id="mark">
        <img src="/logo.jpg" alt="River Industries" />
      </div>
      <div class="boot" id="boot" aria-busy="true">
        <div class="boot-mark">
          <img class="boot-logo" src="/logo.jpg" alt="River Industries" />
          <div class="boot-shimmer" aria-hidden="true"></div>
          <div class="boot-bar" id="boot-bar"></div>
        </div>
      </div>
    </main>
    <script>
      (function () {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var clips = document.querySelectorAll(".holo-clip");
        var total = clips.length;
        var loaded = 0;
        var started = performance.now();
        var finished = false;
        var bar = document.getElementById("boot-bar");
        var boot = document.getElementById("boot");
        var mark = document.getElementById("mark");
        var contact = document.getElementById("contact");

        function setProgress() {
          if (bar) bar.style.transform = "scaleX(" + Math.max(0.08, loaded / total) + ")";
        }
        function finish() {
          if (finished) return;
          finished = true;
          boot.classList.add("is-done");
          boot.setAttribute("aria-busy", "false");
          mark.classList.add("is-shown");
          contact.classList.add("is-shown");
          setTimeout(function () { boot.remove(); }, 520);
        }
        function maybeFinish() {
          if (loaded < total) return;
          var wait = Math.max(0, 1100 - (performance.now() - started));
          setTimeout(finish, reduce ? 0 : wait);
        }

        clips.forEach(function (cell) {
          var video = cell.querySelector("video");
          var once = false;
          function reveal() {
            if (once) return;
            once = true;
            cell.classList.add("is-revealed");
            loaded += 1;
            setProgress();
            maybeFinish();
          }
          if (reduce) {
            reveal();
            if (video) video.pause();
            return;
          }
          if (video) {
            video.addEventListener("canplay", reveal, { once: true });
            video.addEventListener("loadeddata", reveal, { once: true });
            if (video.readyState >= 2) reveal();
          }
        });
        setTimeout(finish, 8000);
      })();
    </script>
  </body>
